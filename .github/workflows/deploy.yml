name: Testseite deployen

# Baut die Website und stellt sie auf der Testseite (Port 3001) bereit.
# Die Live-Seite bleibt unberührt – live geschaltet wird mit dem Workflow
# "Freigabe / Rollback". Einrichtung: siehe deploy/README.md
#
# Manuell starten (Actions → "Testseite deployen" → Run workflow) kann man
# auch für einen anderen Branch, z.B. um ihn vor dem Merge zu testen.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Gemeinsame Gruppe mit der Freigabe, damit nie zwei Läufe gleichzeitig umschalten
concurrency:
  group: skiclub-server
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: webuser
      BASE_DIR: /var/www/nextjs/scw

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: Next.js bauen
        run: npm run build

      - name: Standalone-Verzeichnis vorbereiten
        run: |
          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Server-Skripte übertragen
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$BASE_DIR/releases' '$BASE_DIR/shared'"

          rsync -az \
            deploy/scw-release.sh \
            deploy/ecosystem.config.js \
            "$VPS_USER@$VPS_HOST:$BASE_DIR/"

          ssh "$VPS_USER@$VPS_HOST" "chmod +x '$BASE_DIR/scw-release.sh'"

      - name: Alte Releases aufräumen
        run: |
          # Vor der Übertragung, damit genug Platz für das neue Release frei ist
          ssh "$VPS_USER@$VPS_HOST" "'$BASE_DIR/scw-release.sh' cleanup"

      - name: Release übertragen
        run: |
          RELEASE_DIR="$BASE_DIR/releases/$GITHUB_SHA"

          # Unveränderte Dateien (v.a. Bilder) aus der aktuellen Testseite per
          # Hardlink übernehmen statt neu zu übertragen
          LINK_DEST=""
          if ssh "$VPS_USER@$VPS_HOST" "test -d '$BASE_DIR/staging/'"; then
            LINK_DEST="--link-dest=$BASE_DIR/staging/"
          fi

          # Bewusst ohne -a/-t: Die Änderungszeiten sind nach jedem Checkout
          # neu, rsync würde sonst jede Datei als geändert ansehen und keine
          # Hardlinks setzen. --checksum vergleicht stattdessen den Inhalt.
          rsync -rlpz --checksum --delete $LINK_DEST \
            .next/standalone/ \
            "$VPS_USER@$VPS_HOST:$RELEASE_DIR/"

      - name: Testseite umschalten
        run: |
          ssh "$VPS_USER@$VPS_HOST" "'$BASE_DIR/scw-release.sh' staging '$GITHUB_SHA'"

      - name: Zusammenfassung
        run: |
          {
            echo "### Testseite aktualisiert"
            echo ""
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Nach dem Testen live schalten: **Actions → Freigabe / Rollback → Run workflow → freigeben**"
          } >> "$GITHUB_STEP_SUMMARY"
